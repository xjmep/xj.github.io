<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电气系统图纸 - 预览</title>
    <style>
        /* ================= 基础页面与列表样式 ================= */
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            /* 禁止选中文字/图片 */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .container {
            width: 98%;
            max-width: 1600px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid #ccc;
            cursor: zoom-in; /* 鼠标变成放大镜 */
            transition: transform 0.2s;
        }
        
        .image-wrapper:hover {
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .image-wrapper img {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none; /* 防下载：事件穿透 */
            -webkit-user-drag: none;
        }

        .image-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background-color: transparent;
            -webkit-touch-callout: none; 
        }

        /* ================= 水印层样式 ================= */
        #watermark-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* 关键：让水印不阻挡鼠标点击 */
            z-index: 9999; /* 层级高于所有内容，包括全屏弹窗 */
            /* 背景图由 JS 动态生成 */
        }

        /* ================= 鼠标跟随提示文字样式 ================= */
        #cursor-tooltip {
            position: fixed;
            background-color: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none; /* 关键：让提示框不响应鼠标，避免闪烁 */
            z-index: 10000;
            opacity: 0; /* 默认透明隐藏 */
            transition: opacity 0.15s ease;
            transform: translate(15px, 15px); /* 偏移一点，防止挡鼠标 */
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* ================= 放大查看器 (Modal) 样式 ================= */
        #image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 9998; /* 层级低于水印层 */
            overflow: hidden; 
        }

        #modal-img {
            max-width: 95%;
            max-height: 95%;
            cursor: grab;
            transform-origin: center center;
            transition: transform 0.1s ease-out; 
            user-select: none;
            -webkit-user-drag: none;
        }

        #modal-img:active {
            cursor: grabbing;
        }

        .modal-hint {
            position: absolute;
            bottom: 20px;
            color: #ccc;
            font-size: 14px;
            pointer-events: none;
        }

        #close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            transition: color 0.2s;
        }
        #close-modal:hover {
            color: #ff4d4f;
        }
    </style>
</head>
<body>

    <!-- 水印容器 -->
    <div id="watermark-container"></div>

    <!-- 鼠标跟随提示框 -->
    <div id="cursor-tooltip">可点击放大</div>

    <!-- 列表容器 -->
    <div class="container" id="image-container"></div>

    <!-- 全屏放大查看器 -->
    <div id="image-modal">
        <span id="close-modal">&times;</span>
        <img id="modal-img" src="" alt="放大查看">
        <div class="modal-hint">滚轮缩放 | 按住鼠标左键拖拽 | 点击右上角关闭</div>
    </div>

    <script>
        // ==========================================
        // 1. 动态生成水印
        // ==========================================
        function generateWatermark() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // 设置单个水印块的宽高
            canvas.width = 300;
            canvas.height = 200;

            // 设置字体样式 (思源黑体及其常见英文名兼容，字重 400)
            ctx.font = '400 24px "Source Han Sans CN", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif';
            ctx.fillStyle = 'rgba(150, 150, 150, 0.15)'; // 浅灰色半透明，不影响读图
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 旋转画布并绘制文字
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(-30 * Math.PI / 180); // 倾斜 -30 度
            ctx.fillText('XJ MEP', 0, 0);

            // 将 Canvas 转为 Data URL 并应用到容器上
            const watermarkContainer = document.getElementById('watermark-container');
            watermarkContainer.style.backgroundImage = `url(${canvas.toDataURL('image/png')})`;
            watermarkContainer.style.backgroundRepeat = 'repeat';
        }

        // 页面加载时生成水印
        generateWatermark();

        // ==========================================
        // 防护措施：禁用右键、拖拽、常用保存快捷键
        // ==========================================
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('dragstart', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                return false;
            }
        });

        // ==========================================
        // 动态加载 17 张图片
        // ==========================================
        const imageCount = 17; 
        const container = document.getElementById('image-container');
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
        const closeModal = document.getElementById('close-modal');
        const tooltip = document.getElementById('cursor-tooltip'); 

        // 模态框状态变量
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX, startY;

        // 生成图片列表
        for (let i = 1; i <= imageCount; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';
            
            const img = document.createElement('img');
            const imgSrc = `${i}.webp`;
            img.src = imgSrc; 
            img.alt = `电气图纸 - 第${i}页`;
            
            wrapper.appendChild(img);
            
            wrapper.addEventListener('mouseenter', () => {
                tooltip.style.opacity = '1';
            });

            wrapper.addEventListener('mouseleave', () => {
                tooltip.style.opacity = '0';
            });

            wrapper.addEventListener('click', () => {
                modal.style.display = 'flex';
                modalImg.src = imgSrc;
                tooltip.style.opacity = '0'; // 点击时隐藏提示
                scale = 1; translateX = 0; translateY = 0;
                updateTransform();
            });

            container.appendChild(wrapper);
        }

        // ==========================================
        // 鼠标跟随提示框逻辑
        // ==========================================
        document.addEventListener('mousemove', (e) => {
            tooltip.style.left = e.clientX + 'px';
            tooltip.style.top = e.clientY + 'px';
        });

        // ==========================================
        // 放大查看器交互逻辑
        // ==========================================
        function updateTransform() {
            modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function hideModal() {
            modal.style.display = 'none';
            modalImg.src = ''; 
        }

        closeModal.addEventListener('click', hideModal);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) hideModal();
        });

        modal.addEventListener('wheel', (e) => {
            e.preventDefault(); 
            const delta = e.deltaY > 0 ? -0.2 : 0.2; 
            scale += delta;
            if (scale < 0.5) scale = 0.5; 
            if (scale > 8) scale = 8; 
            updateTransform();
        }, { passive: false });

        modalImg.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            modalImg.style.transition = 'none'; 
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                modalImg.style.transition = 'transform 0.1s ease-out'; 
            }
        });
    </script>
</body>
</html>
